name: Preview

on:
  pull_request:

permissions:
  checks: write
  id-token: write
  contents: write
  pull-requests: write

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # https://github.com/pnpm/action-setup
      # Must come before setup-node so its pnpm cache can locate the store
      - uses: pnpm/action-setup@v4

      # https://github.com/actions/setup-node
      - uses: actions/setup-node@v6
        with:
          # tsdown requires Node >= 22.18, pnpm 11 requires Node >= 22.13
          node-version: 22
          cache: 'pnpm'

      - name: Install
        id: install
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Publish Preview
        run: pnpm dlx pkg-pr-new publish --pnpm "./packages/aws-sigv4-fetch" "./packages/aws-sigv4-sign"
