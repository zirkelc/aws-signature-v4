name: CI

on:
  push:
    branches:
      - 'main'
    tags-ignore:
      - '**' # Ignore tags created by releases
  pull_request:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

permissions:
  checks: write
  id-token: write # needed for npm publish with provenance
  contents: write # needed for github release
  pull-requests: write # needed for coverage comment

# pnpm 11 requires Node >= 22.13, so every job installs on Node 22. Only the unit
# tests then switch the runtime to the Node version under test.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # https://github.com/pnpm/action-setup
      # Must come before setup-node so its pnpm cache can locate the store
      - uses: pnpm/action-setup@v4

      # https://github.com/actions/setup-node
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install
        id: install
        run: pnpm install

      - name: Lint
        run: pnpm lint:ci

      - name: Format
        run: pnpm format:ci

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install
        id: install
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          # tsdown requires Node >= 22.18, even though the packages themselves support Node >= 20
          node-version: 22
          cache: 'pnpm'

      - name: Install
        id: install
        run: pnpm install

      - name: Build
        run: pnpm build

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Install on Node 22, because pnpm 11 itself requires Node >= 22.13
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install
        id: install
        run: pnpm install

      # Switch the runtime to the version under test. The tests run against the
      # TypeScript sources, so no build is needed. vitest is invoked directly
      # rather than through pnpm, which cannot itself run on Node 20.
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.version }}

      - name: Test
        run: node_modules/.bin/vitest run --project='unit/*'

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install
        id: install
        run: pnpm install

      - name: Test
        run: pnpm test:cov

      - name: Coverage
        if: ${{ steps.install.conclusion == 'success' }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          vite-config-path: vitest.config.ts

  e2e-test:
    name: E2E Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          # The HTTP client suite pulls in got, which requires Node >= 22
          node-version: 22
          cache: 'pnpm'

      - name: Install
        id: install
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Deploy
        working-directory: test/aws
        run: pnpm run deploy

      - name: Test
        run: pnpm test:e2e

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      prs_created: ${{ steps.release.outputs.prs_created }}

    steps:
      # https://github.com/googleapis/release-please-action
      - name: Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT is required so that the releases this creates trigger the Release workflow.
          # The default GITHUB_TOKEN deliberately does not trigger other workflows.
          # https://github.com/googleapis/release-please-action?tab=readme-ov-file#github-credentials
          token: ${{ secrets.PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

