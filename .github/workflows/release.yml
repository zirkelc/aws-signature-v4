name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
permissions:
  checks: write
  contents: write
  pull-requests: write
  packages: read
  # Required for npm trusted publishing, which mints a short-lived OIDC token instead of using NPM_TOKEN
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup and Install
        id: install
        uses: zirkelc/setup-and-install@v1
        with:
          # Publishing runs the build, and tsdown requires Node >= 22.18 (pnpm 11 needs >= 22.13)
          node-version: 22

      - name: Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          # Use PAT to create a new GitHub release PR, because the default GITHUB_TOKEN doesn't trigger workflows
          # https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
          # https://github.com/orgs/community/discussions/55906
          GITHUB_TOKEN: ${{ secrets.PAT }}
