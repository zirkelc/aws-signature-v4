# IMPORTANT: DO NOT RENAME THIS FILE
# It uses Trusted Publisher to deploy without token
# https://www.npmjs.com/package/aws-sigv4-fetch/access
# https://www.npmjs.com/package/aws-sigv4-sign/access

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# Releasing both packages publishes two GitHub releases, so two runs can overlap.
# Serialize them instead of cancelling: publishing is idempotent, since pnpm skips
# any package whose version is already in the registry.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write # needed for npm publish with provenance
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # http://github.com/actions/checkout
      - uses: actions/checkout@v4
      # https://github.com/pnpm/action-setup
      - uses: pnpm/action-setup@v4
      # https://github.com/actions/setup-node
      # Used directly rather than the shared setup action, because trusted publishing
      # needs the registry written into .npmrc for the OIDC exchange.
      - uses: actions/setup-node@v6
        with:
          # tsdown requires Node >= 22.18, pnpm 11 requires Node >= 22.13
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'

      - run: pnpm install

      - run: pnpm build

      - name: Publish to npm
        run: pnpm release
